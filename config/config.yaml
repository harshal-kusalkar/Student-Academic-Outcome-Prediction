preprocessing:
  drop_columns:

    # Redundant / low-importance features
    - Educational special needs
    - GDP
    - Nacionality
    - International
    - Displaced
    - Unemployment rate
    - Daytime/evening attendance
    - Curricular units 1st sem (credited)
    - Curricular units 1st sem (without evaluations)

    # Second semester features (data leakage)
    - Curricular units 2nd sem (credited)
    - Curricular units 2nd sem (enrolled)
    - Curricular units 2nd sem (evaluations)
    - Curricular units 2nd sem (approved)
    - Curricular units 2nd sem (grade)
    - Curricular units 2nd sem (without evaluations)
  
  target_col: Target
  target:
    - Dropout
    - Enrolled 
    - Graduate
  
data_split:
  test_size: 0.2
  random_state: 42

data_paths:
  data_dir_path: data


artifacts:
  model_path: artifacts/models/best_model.joblib
  encoder_path: artifacts/encoder.joblib
  feature_names_path: artifacts/feature_names.joblib
  data_validation_path: artifacts/reports/validation.json
  eval_result_path: artifacts/eval_result.json
  classification_report_path: artifacts/classification_report.joblib

processed_data:
  X_train_path: data/processed/X_train.csv
  X_test_path: data/processed/X_test.csv
  y_train_path: data/processed/y_train.npy
  y_test_path: data/processed/y_test.npy

model:
  name: LightGBM
  version: v1

training:
  random_state: 42
  n_jobs: -1

model_params:
  # General & Objective Parameters
  objective: "multi:softprob"  # XGBoost multiclass objective (returns probabilities)
  eval_metric: "mlogloss"      # Standard multiclass logloss metric
  booster: "gbtree"            # Tree-based boosting model
  verbosity: 0

  # Optimized Hyperparameters (Trial 75)
  n_estimators: 793
  learning_rate: 0.07585889011659572
  max_depth: 4
  min_child_weight: 2
  subsample: 0.8979146985252445
  colsample_bytree: 0.7445933533191227
  gamma: 0.7235077637726208             # Minimum loss reduction for partition (formerly min_split_gain)
  reg_alpha: 0.003036500880302069       # L1 regularization
  reg_lambda: 1.587516557021529e-05     # L2 regularization

experiment:
  model_name: "XGBoost"
  best_trial: 24
  cv_metric: "f1_macro"
  best_cv_score: 0.6739500714665354
    

